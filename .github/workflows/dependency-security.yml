name: Dependency security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      # Keep results in the workflow artifacts without requiring a paid code-scanning feature.
      upload-sarif: false
      fail-on-vuln: true
